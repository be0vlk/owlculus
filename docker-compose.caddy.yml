services:
  # Caddy reverse proxy with automatic HTTPS
  caddy:
    image: caddy:2-alpine
    container_name: owlculus-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      frontend-network:
        ipv4_address: 172.28.0.254
    depends_on:
      - frontend
      - backend
    environment:
      - ACME_AGREE=true

  # Override frontend to remove port mapping (Caddy handles it)
  frontend:
    ports: [ ]

  # Override backend to remove port mapping (Caddy handles it)
  backend:
    ports: [ ]
    environment:
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.28.0.254}

volumes:
  caddy_data:
    name: owlculus_caddy_data
  caddy_config:
    name: owlculus_caddy_config

networks:
  frontend-network:
    ipam:
      config:
        - subnet: 172.28.0.0/24
