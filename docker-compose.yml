x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  target: production

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
        reservations:
          memory: 256m
          cpus: '0.25'
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-owlculus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-owlculus_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-owlculus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    # Database port not exposed to host for security
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-owlculus} -d ${POSTGRES_DB:-owlculus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  # Shared rate-limit storage
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  # Backend API
  backend:
    build: *backend-build
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2.0'
        reservations:
          memory: 512m
          cpus: '0.5'
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-owlculus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-owlculus_secure_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-owlculus}
      SECRET_KEY: ${SECRET_KEY:-development_key_not_secure}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EXECUTION_LIMIT_GLOBAL: ${EXECUTION_LIMIT_GLOBAL:-1000}
      EXECUTION_LIMIT_CASE: ${EXECUTION_LIMIT_CASE:-100}
      EXECUTION_LIMIT_USER: ${EXECUTION_LIMIT_USER:-25}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.29.0.254}
    volumes:
      - uploads_data:/app/uploads
      - setup_data:/app/data/setup
    expose:
      - "8000"
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - frontend-network
      - backend-network

  plugin-worker:
    stop_grace_period: 75s
    build: *backend-build
    restart: unless-stopped
    command: ["celery", "-A", "app.executions.celery_app:app", "worker", "--pool=prefork", "--concurrency=${PLUGIN_CONCURRENCY:-2}", "--prefetch-multiplier=1", "--queues=owlculus.plugins", "--hostname=plugins@%h", "--loglevel=WARNING"]
    environment: &execution-environment
      PLUGIN_EXECUTION_SECONDS: ${PLUGIN_EXECUTION_SECONDS:-900}
      HUNT_STEP_SECONDS: ${HUNT_STEP_SECONDS:-900}
      HUNT_EXECUTION_SECONDS: ${HUNT_EXECUTION_SECONDS:-7200}
      EXECUTION_EVENT_LIMIT_BYTES: ${EXECUTION_EVENT_LIMIT_BYTES:-1048576}
      EXECUTION_RESULT_LIMIT_BYTES: ${EXECUTION_RESULT_LIMIT_BYTES:-26214400}
      EXECUTION_REDISPATCH_SECONDS: ${EXECUTION_REDISPATCH_SECONDS:-30}
      POSTGRES_USER: ${POSTGRES_USER:-owlculus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-owlculus_secure_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-owlculus}
      SECRET_KEY: ${SECRET_KEY:-development_key_not_secure}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.executions.celery_app:app inspect ping --destination plugins@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend-network
      - worker-egress

  hunt-worker:
    stop_grace_period: 75s
    build: *backend-build
    restart: unless-stopped
    command: ["celery", "-A", "app.executions.celery_app:app", "worker", "--pool=prefork", "--concurrency=${HUNT_CONCURRENCY:-2}", "--prefetch-multiplier=1", "--queues=owlculus.hunts", "--hostname=hunts@%h", "--loglevel=WARNING"]
    environment: *execution-environment
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.executions.celery_app:app inspect ping --destination hunts@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend-network
      - worker-egress

  execution-dispatcher:
    build: *backend-build
    restart: unless-stopped
    command: ["python", "-m", "app.executions.dispatcher"]
    environment: *execution-environment
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.stat('/tmp/owlculus-dispatcher-heartbeat').st_mtime < 30"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - backend-network

  # Database Initialization
  db-init:
    build: *backend-build
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-owlculus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-owlculus_secure_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-owlculus}
      SECRET_KEY: ${SECRET_KEY:-development_key_not_secure}
    command: python3 -m app.database.init_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-network
    restart: "no"

  # Browser-facing Caddy gateway and compiled SPA
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
        reservations:
          memory: 128m
          cpus: '0.1'
    security_opt:
      - no-new-privileges:true
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      frontend-network:
        ipv4_address: 172.29.0.254

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  setup_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  worker-egress:
    driver: bridge
  frontend-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
  backend-network:
    driver: bridge
    internal: true
