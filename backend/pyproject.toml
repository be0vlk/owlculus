[project]
name = "owlculus-backend"
version = "0.1.0"
description = "Backend API for the Owlculus OSINT case management platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bcrypt==5.0.0",
    "beautifulsoup4==4.15.0",
    "celery[redis]==5.6.3",
    "chardet==7.6.0",
    "cryptography==50.0.1",
    "defusedxml==0.7.1",
    "dnspython==2.9.0",
    "fastapi[standard]==0.162.5",
    "filetype==1.2.0",
    "fpdf2==2.8.8",
    "holehe==1.61",
    "idna==3.19",
    "loguru==0.7.3",
    "olefile==0.47",
    "openai==3.7.0",
    "peopledatalabs==6.4.13",
    "pillow>=13.0,<14",
    "psycopg2-binary==2.9.12",
    "pydantic-settings==2.15.0",
    "pyjwt==2.15.0",
    "pypdfium2==5.13.0",
    "python-multipart==0.0.32",
    "python-whois==0.9.6",
    "redis==6.4.0",
    "shodan==1.31.0",
    "sqlmodel==0.0.42",
    "uvicorn==0.52.4",
    "vt-py==0.22.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pypdf==6.21.4",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-timeout==2.4.0",
    "ruff==0.16.5",
]

[tool.uv]
package = false

[tool.ruff.lint]
# Pinned so ruff upgrades cannot silently widen the pre-commit gate.
select = ["E4", "E7", "E9", "F", "I"]
# `== None`/`== True` build SQLAlchemy expressions.
ignore = ["E711", "E712"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
# Application imports must be followed and checked; untyped third-party packages are
# handled only by the narrow module overrides below.
follow_imports = "normal"
# This baseline checks untyped bodies and high-signal correctness warnings without
# claiming full `strict` coverage for the backend's remaining annotation backlog.
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true

# These installed runtime dependencies do not publish stubs or a py.typed marker.
[[tool.mypy.overrides]]
module = [
    "defusedxml.*",
    "olefile",
    "pypdfium2.*",
    "filetype",
    "holehe.*",
    "peopledatalabs.*",
    "psycopg2.*",
    "shodan.*",
    "vt.*",
    "whois.*",
]
ignore_missing_imports = true
