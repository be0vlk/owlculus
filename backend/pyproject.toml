[project]
name = "owlculus-backend"
version = "0.1.0"
description = "Backend API for the Owlculus OSINT case management platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp==3.14.3",
    "bcrypt==5.0.0",
    "beautifulsoup4==4.15.0",
    "celery[redis]==5.6.3",
    "chardet==7.6.0",
    "cryptography==50.0.1",
    "dnspython==2.8.0",
    "fastapi[standard]==0.115.6",
    "filetype==1.2.0",
    "fpdf2==2.8.8",
    "holehe==1.61",
    "loguru==0.7.3",
    "openai==3.7.0",
    "peopledatalabs==6.4.13",
    "psycopg2-binary==2.9.12",
    "pydantic-settings==2.15.0",
    "pyexiftool==0.5.6",
    "pyjwt==2.13.0",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "python-whois==0.9.6",
    "redis==6.4.0",
    "selenium==4.48.0",
    "shodan==1.31.0",
    "sqlalchemy-utils==0.42.1",
    "sqlmodel==0.0.42",
    "uvicorn==0.52.4",
    "vt-py==0.22.0",
    "werkzeug==3.1.8",
]

[dependency-groups]
