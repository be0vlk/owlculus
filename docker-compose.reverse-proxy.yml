# Reverse-proxy adapter; apply after docker-compose.yml.
services:
  backend:
    ports: !reset []
    expose:
      - "8000"
    environment:
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost}
      BACKEND_URL: ${BACKEND_URL:-https://localhost/api}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.29.0.254}

  frontend:
    ports: !reset []
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    container_name: owlculus-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      frontend-network:
        ipv4_address: 172.29.0.254
    depends_on:
      - frontend
      - backend
    environment:
      ACME_AGREE: "true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  caddy_data:
    name: owlculus_caddy_data
  caddy_config:
    name: owlculus_caddy_config

networks:
  frontend-network:
    ipam:
      config:
        - subnet: 172.29.0.0/24
