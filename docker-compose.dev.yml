# Development adapter; apply after docker-compose.yml.
x-backend-development-build: &backend-development-build
  context: ./backend
  dockerfile: Dockerfile
  target: development

services:
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-owlculus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-owlculus_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-owlculus_dev}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-owlculus} -d ${POSTGRES_DB:-owlculus_dev}"]

  redis:
    volumes:
      - redis_dev_data:/data

  backend:
    build: *backend-development-build
    environment:
      POSTGRES_USER: ${RUNTIME_POSTGRES_USER:-owlculus_runtime}
      POSTGRES_PASSWORD: ${RUNTIME_POSTGRES_PASSWORD:-owlculus_dev_runtime_password}
      POSTGRES_DB: ${POSTGRES_DB:-owlculus_dev}
      OWLCULUS_ENV: development
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.30.0.254}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      OWLCULUS_LOG_FILE: ${OWLCULUS_LOG_FILE:-logs/owlculus.log}
    volumes:
      - ./backend:/app
      - uploads_dev_data:/app/uploads
      - setup_dev_data:/app/data/setup
      - logs_dev_data:/app/logs
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"

  plugin-worker:
    build: *backend-development-build
    environment: &execution-development-environment
      POSTGRES_PASSWORD: ${RUNTIME_POSTGRES_PASSWORD:-owlculus_dev_runtime_password}
      POSTGRES_DB: ${POSTGRES_DB:-owlculus_dev}
      OWLCULUS_ENV: development
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production}
    volumes:
      - ./backend:/app
      - uploads_dev_data:/app/uploads

  hunt-worker:
    build: *backend-development-build
    environment: *execution-development-environment
    volumes:
      - ./backend:/app
      - uploads_dev_data:/app/uploads

  execution-dispatcher:
    build: *backend-development-build
    environment: *execution-development-environment
    volumes:
      - ./backend:/app

  db-init:
    build: *backend-development-build
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-owlculus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-owlculus_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-owlculus_dev}
      RUNTIME_POSTGRES_USER: ${RUNTIME_POSTGRES_USER:-owlculus_runtime}
      RUNTIME_POSTGRES_PASSWORD: ${RUNTIME_POSTGRES_PASSWORD:-owlculus_dev_runtime_password}
      OWLCULUS_ENV: development
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production}
    volumes:
      - ./backend:/app

  frontend:
    build: !override
      context: ./frontend
      dockerfile: Dockerfile.dev
    deploy:
      resources:
        limits:
          # Cold Vite transforms under Node 24 can exceed 512 MiB.
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 256m
          cpus: "0.25"
    environment: !override
      NODE_ENV: development
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${DEV_HOST:-localhost}
      API_PROXY_TARGET: http://backend:8000
    volumes: !override
      - ./frontend:/app
      - /app/node_modules
    ports: !override
      - "${DEV_BIND_HOST:-127.0.0.1}:${DEV_FRONTEND_PORT:-5173}:5173"
    command: npm run dev -- --host 0.0.0.0
    healthcheck: !reset null
    networks: !override
      frontend-network:
        ipv4_address: 172.30.0.254

volumes:
  postgres_dev_data:
    driver: local
  uploads_dev_data:
    driver: local
  logs_dev_data:
    driver: local
  setup_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  frontend-network:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backend-network:
    internal: false
